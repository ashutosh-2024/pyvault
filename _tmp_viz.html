<!doctype html><meta charset="utf-8"><style>body{margin:0}iframe{border:0;width:100%;height:100vh}</style>
<pre id="out" style="position:fixed;bottom:0;left:0;background:#fff;color:#000;z-index:9;margin:0">wait</pre>
<iframe id="f"></iframe>
<script>
var q = new URLSearchParams(location.search), f = document.getElementById("f"), out = document.getElementById("out");
f.src = "problem.html?id=" + q.get("id");
f.onload = function () {
  var d = f.contentDocument, w = f.contentWindow;
  setTimeout(function () {
    d.getElementById("viz-reveal").open = true;
    setTimeout(function () { try {
      d.querySelectorAll(".viz-tab")[+(q.get("ch") || 0)].click();
      for (var i = 0; i < +(q.get("fr") || 0); i++) d.querySelector('[data-act="next"]').click();
      d.documentElement.style.scrollBehavior = "auto";
      var v = d.getElementById("viz-reveal");
      w.scrollTo(0, v.getBoundingClientRect().top + w.scrollY - 10);
      setTimeout(function () { out.textContent = "ok " + [].map.call(d.querySelectorAll(".vz-node"), function (g) { return g.getAttribute("class").replace("vz-cell vz-node", "").trim() || "-"; }).join(","); }, 1200);
    } catch (e) { out.textContent = "ERR " + e; } }, 700);
  }, 300);
};
</script>
